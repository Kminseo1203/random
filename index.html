<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>발로란트 내전용 가위바위보 프로그램</title>
    <!-- [수정] 차단 오류를 일으키던 기존 cloudflare 스크립트 태그를 완벽히 제거하고 안전한 정식 PeerJS CDN만 적용 -->
    <script src="https://cloudflare.com" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f1923;
            color: #ece8e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #172535;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid #ff4655;
            width: 90%;
            max-width: 450px;
        }
        h1 { color: #ff4655; margin-bottom: 10px; font-size: 24px; }
        .status-indicator {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffb846;
            background-color: rgba(255, 184, 70, 0.1);
            padding: 10px;
            border-radius: 6px;
            word-break: break-all;
        }
        .buttons {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }
        button {
            background-color: #ece8e1;
            color: #0f1923;
            border: none;
            padding: 15px 20px;
            font-size: 28px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        button:hover:not(:disabled) {
            background-color: #ff4655;
            color: #ece8e1;
            transform: translateY(-3px);
        }
        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #0f1923;
            border-radius: 8px;
            min-height: 120px;
        }
        .choice-text { font-size: 16px; margin: 10px 0; color: #a3a3a3; }
        .choice-text span { color: #ece8e1; font-weight: bold; }
        #finalResult { font-size: 22px; font-weight: bold; margin-top: 15px; }
        .win { color: #46ff79; }
        .lose { color: #ff4655; }
        .draw { color: #ffb846; }
        .reset-btn {
            margin-top: 15px;
            background-color: #ff4655;
            color: #ece8e1;
            font-size: 16px;
            padding: 10px 20px;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>공수 가르기 가위바위보</h1>
    <div id="status" class="status-indicator">서버 연결 중...</div>
    
    <div class="buttons">
        <button onclick="sendChoice('가위')" id="btnScissors" disabled>✌️</button>
        <button onclick="sendChoice('바위')" id="btnRock" disabled>✊</button>
        <button onclick="sendChoice('보')" id="btnPaper" disabled>🖐️</button>
    </div>

    <div class="result-box">
        <div class="choice-text">내 역할: <span id="myRole">방장 (Player 1)</span></div>
        <div class="choice-text">나의 선택: <span id="myState">대기 중...</span></div>
        <div class="choice-text">상대 선택: <span id="oppState">대기 중...</span></div>
        <div id="finalResult">상대방이 연결되면 시작할 수 있습니다.</div>
    </div>
    
    <button class="reset-btn" id="resetBtn" onclick="resetGame()">다시 경기하기 🔄</button>
</div>

<script>
    let peer = null;
    let conn = null;
    let myChoice = null;
    let oppChoice = null;
    let isHost = true;

    // 우회용 오픈소스 공용 무료 시그널링 서버 정보 지정
    const customConfig = {
        host: 'peerjs.metered.live',
        port: 443,
        path: '/',
        secure: true
    };

    window.addEventListener('load', () => {
        if (typeof Peer === 'undefined') {
            document.getElementById('status').innerText = "라이브러리 로드 실패. 새로고침 해주세요.";
            return;
        }
        initGame();
    });

    function initGame() {
        const urlParams = new URLSearchParams(window.location.search);
        const roomParam = urlParams.get('room');

        if (roomParam) {
            isHost = false;
            document.getElementById('myRole').innerText = "참가자 (Player 2)";
            document.getElementById('status').innerText = "방장에게 연결을 시도하는 중...";
            
            peer = new Peer(customConfig);
            peer.on('open', () => {
                conn = peer.connect(roomParam);
                setupConnection();
            });
        } else {
            isHost = true;
            const randomRoomId = 'vlr-' + Math.random().toString(36).substr(2, 9);
            
            peer = new Peer(randomRoomId, customConfig);
            
            peer.on('open', (id) => {
                const baseUrl = window.location.href.split('?')[0];
                const inviteLink = baseUrl + '?room=' + id;
                document.getElementById('status').innerHTML = `접속 완료! 상대방에게 아래 링크를 전송하세요.<br><b style="color:#ffb846; font-size:13px; user-select:all;">${inviteLink}</b>`;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
            });
        }
        
        peer.on('error', (err) => {
            console.error(err);
            document.getElementById('status').innerText = "연결 오류가 발생했습니다. 링크를 다시 확인하세요.";
        });
    }

    function setupConnection() {
        conn.on('open', () => {
            document.getElementById('status').innerText = "⚡ 상대방과 실시간 연결 성공! 선택해 주세요.";
            enableButtons(true);
        });

        conn.on('data', (data) => {
            if (data.type === 'choice') {
                oppChoice = data.value;
                document.getElementById('oppState').innerText = "선택 완료 🔒";
                checkResult();
            } else if (data.type === 'reset') {
                clearGame();
            }
        });

        conn.on('close', () => {
            document.getElementById('status').innerText = "상대방과의 연결이 끊겼습니다.";
            enableButtons(false);
        });
    }

    function sendChoice(choice) {
        myChoice = choice;
        document.getElementById('myState').innerText = choice;
        enableButtons(false);
        
        if (conn && conn.open) {
            conn.send({ type: 'choice', value: choice });
        }
        checkResult();
    }

    function checkResult() {
        if (myChoice && oppChoice) {
            document.getElementById('oppState').innerText = oppChoice;
            const resultEl = document.getElementById('finalResult');
            
            if (myChoice === oppChoice) {
                resultEl.innerText = "무승부! 다시 진행하세요 🤝";
                resultEl.className = "draw";
            } else if (
                (myChoice === '가위' && oppChoice === '보') ||
                (myChoice === '바위' && oppChoice === '가위') ||
                (myChoice === '보' && oppChoice === '바위')
            ) {
                resultEl.innerText = "당신의 승리! 진영 선택권을 획득했습니다 🎉";
                resultEl.className = "win";
            } else {
                resultEl.innerText = "당신의 패배.. 상대방이 진영을 선택합니다 😢";
                resultEl.className = "lose";
            }
            document.getElementById('resetBtn').style.display = 'block';
        }
    }

    function resetGame() {
        if (conn && conn.open) {
            conn.send({ type: 'reset' });
        }
        clearGame();
    }

    function clearGame() {
        myChoice = null;
        oppChoice = null;
        document.getElementById('myState').innerText = "대기 중...";
        document.getElementById('oppState').innerText = "대기 중...";
        document.getElementById('finalResult').innerText = "양쪽 모두 골라야 결과가 공개됩니다.";
        document.getElementById('finalResult').className = "";
        document.getElementById('resetBtn').style.display = 'none';
        enableButtons(true);
    }

    function enableButtons(bool) {
        document.getElementById('btnScissors').disabled = !bool;
        document.getElementById('btnRock').disabled = !bool;
        document.getElementById('btnPaper').disabled = !bool;
    }
</script>
</body>
</html>
