<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>발로란트 내전용 가위바위보</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f1923;
            color: #ece8e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #172535;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 2px solid #ff4655;
            width: 90%;
            max-width: 450px;
        }
        h1 { color: #ff4655; margin-bottom: 10px; font-size: 24px; }
        .status-indicator {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #ffb846;
            background-color: rgba(255, 184, 70, 0.1);
            padding: 8px;
            border-radius: 6px;
        }
        .buttons {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }
        button {
            background-color: #ece8e1;
            color: #0f1923;
            border: none;
            padding: 15px 20px;
            font-size: 28px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        button:hover:not(:disabled) {
            background-color: #ff4655;
            color: #ece8e1;
            transform: translateY(-3px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #0f1923;
            border-radius: 8px;
            min-height: 120px;
        }
        .choice-text { font-size: 16px; margin: 10px 0; color: #a3a3a3; }
        .choice-text span { color: #ece8e1; font-weight: bold; }
        #finalResult { font-size: 22px; font-weight: bold; margin-top: 15px; }
        .win { color: #46ff79; }
        .lose { color: #ff4655; }
        .draw { color: #ffb846; }
        .reset-btn {
            margin-top: 15px;
            background-color: #ff4655;
            color: #ece8e1;
            font-size: 16px;
            padding: 10px 20px;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>실시간 매칭 가위바위보 </h1>
    <div id="status" class="status-indicator">서버 연결 중...</div>
    
    <div class="buttons" id="btnGroup">
        <button onclick="sendChoice('가위')" id="btnScissors" disabled>✌️</button>
        <button onclick="sendChoice('바위')" id="btnRock" disabled>✊</button>
        <button onclick="sendChoice('보')" id="btnPaper" disabled>🖐️</button>
    </div>

    <div class="result-box">
        <div class="choice-text">내 역할: <span id="myRole">-</span></div>
        <div class="choice-text">플레이어 1: <span id="p1State">대기 중...</span></div>
        <div class="choice-text">플레이어 2: <span id="p2State">대기 중...</span></div>
        <div id="finalResult">상대방을 기다리는 중입니다.</div>
    </div>
    
    <button class="reset-btn" id="resetBtn" onclick="requestReset()" style="display:none;">다시 경기하기 🔄</button>
</div>

<!-- 최신 Firebase v10 모듈 스크립트 사용 -->
<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, onValue, update, get } from "https://gstatic.com";

    // 공용 임시 DB 설정
    const firebaseConfig = {
        databaseURL: "https://firebaseio.com"
    };
    
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    // 💡 아래 "game_room" 부분을 우리 팀만의 영어 단어로 바꾸면 독립된 방이 됩니다!
    const roomRef = ref(database, "game_room"); 

    let myRole = null; 
    let p1Choice = null;
    let p2Choice = null;

    // 1. 방 접속 및 플레이어 역할 할당
    get(roomRef).then((snapshot) => {
        const data = snapshot.val() || {};
        if (!data.p1) {
            myRole = 'p1';
            update(roomRef, { p1: 'connected' });
            document.getElementById('myRole').innerText = "플레이어 1 (선공 팀)";
        } else if (!data.p2) {
            myRole = 'p2';
            update(roomRef, { p2: 'connected' });
            document.getElementById('myRole').innerText = "플레이어 2 (후공 팀)";
        } else {
            myRole = 'spectator';
            document.getElementById('myRole').innerText = "관전자";
            document.getElementById('status').innerText = "방이 가득 찼습니다. 관전 중...";
        }
    }).catch((error) => {
        document.getElementById('status').innerText = "네트워크 오류 발생. 다시 열어주세요.";
        console.error(error);
    });

    // 2. 실시간 데이터 변화 감지
    onValue(roomRef, (snapshot) => {
        const data = snapshot.val() || {};
        p1Choice = data.p1Choice;
        p2Choice = data.p2Choice;

        if (myRole !== 'spectator') {
            if (data.p1 && data.p2) {
                document.getElementById('status').innerText = "양쪽 모두 접속 완료! 가위바위보를 선택하세요.";
                enableButtons(true);
            } else {
                document.getElementById('status').innerText = "상대방의 접속을 기다리고 있습니다...";
                enableButtons(false);
            }
        }

        document.getElementById('p1State').innerText = p1Choice ? "선택 완료 🔒" : (data.p1 ? "고르는 중..." : "미접속");
        document.getElementById('p2State').innerText = p2Choice ? "선택 완료 🔒" : (data.p2 ? "고르는 중..." : "미접속");

        if (p1Choice && p2Choice) {
            enableButtons(false);
            document.getElementById('p1State').innerText = p1Choice;
            document.getElementById('p2State').innerText = p2Choice;
            
            judgeResult();
            document.getElementById('resetBtn').style.display = 'block';
        } else {
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('finalResult').className = "";
        }
    });

    // 전역 함수 등록 (HTML 내부의 onclick과 연동하기 위함)
    window.sendChoice = function(choice) {
        if (myRole === 'p1') update(roomRef, { p1Choice: choice });
        if (myRole === 'p2') update(roomRef, { p2Choice: choice });
        enableButtons(false);
    }

    window.requestReset = function() {
        update(roomRef, { p1Choice: null, p2Choice: null });
        document.getElementById('finalResult').innerText = "새 게임이 시작되었습니다. 다시 골라주세요!";
    }

    function judgeResult() {
        const resultEl = document.getElementById('finalResult');
        if (p1Choice === p2Choice) {
            resultEl.innerText = "무승부! 다시 진행해 주세요. 🤝";
            resultEl.className = "draw";
        } else if (
            (p1Choice === '가위' && p2Choice === '보') ||
            (p1Choice === '바위' && p2Choice === '가위') ||
            (p1Choice === '보' && p2Choice === '바위')
        ) {
            if (myRole === 'p1') { resultEl.innerText = "당신의 승리! 🎉 (진영 선택)"; resultEl.className = "win"; }
            else if (myRole === 'p2') { resultEl.innerText = "당신의 패배.. 😢 (상대 진영 선택)"; resultEl.className = "lose"; }
            else { resultEl.innerText = "플레이어 1 승리! 🎉"; }
        } else {
            if (myRole === 'p2') { resultEl.innerText = "당신의 승리! 🎉 (진영 선택)"; resultEl.className = "win"; }
            else if (myRole === 'p1') { resultEl.innerText = "당신의 패배.. 😢 (상대 진영 선택)"; resultEl.className = "lose"; }
            else { resultEl.innerText = "플레이어 2 승리! 🎉"; }
        }
    }

    function enableButtons(bool) {
        if (myRole === 'spectator') return;
        document.getElementById('btnScissors').disabled = !bool;
        document.getElementById('btnRock').disabled = !bool;
        document.getElementById('btnPaper').disabled = !bool;
    }

    // 나갈 때 청소
    window.addEventListener('beforeunload', () => {
        if (myRole === 'p1') update(roomRef, { p1: null, p1Choice: null });
        if (myRole === 'p2') update(roomRef, { p2: null, p2Choice: null });
    });
</script>
</body>
</html>
